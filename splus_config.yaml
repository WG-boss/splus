# ============================================================
# L1 状态层
# ============================================================
state:
  persistence: 0.55      # 先验粘性（越大越不轻易切换状态，抗噪）
  temperature: 0.85      # 似然温度（越大越平缓，越保守）
  min_confidence_to_act: 0.65   # 低于此置信度只能持有/观察，不得开新仓
  uniform_prior: 0.20           # 无历史先验时的均匀先验（五状态各 1/5）
  # 五状态：A 吸筹 / B 突破 / C 通道 / D 派发 / E 下跌


  # ---- 五状态打分模型（原硬编码 76 个字面量全部移至此处）----
  # 字段说明：feat 特征名 / dir up|down|bool / lo,hi 隶属度区间 / w 权重
  #          gate 必须项（乘法门控，缺则大幅压分）/ gate_op= max 时取最大
  # 可选派生特征：dd_pos, abs_above_ma200, rel_ema20, hhll, lh_ll,
  #              down_er, stacked, is_breakout（在 engine._derive 中实现）
  scoring:
    # gate 中 dir=bool 未命中时的默认给分（原代码硬编码 0.05）
    _default_miss: 0.05
    A:
      gate:
        # 门控语义：是否已发生足够深度回撤。达到 18% 即满格，10%~18% 部分给分。
        # 原为 lo:0.18 hi:0.40，导致回撤 19.6% 时 gate 仅 0.07（语义错误）。
        - {feat: dd_pos, dir: up, lo: 0.10, hi: 0.18}
      core:
        - {feat: atr_pct_rank, dir: down, lo: 0.20, hi: 0.60, w: 1.20}
        - {feat: er20, dir: down, lo: 0.10, hi: 0.35, w: 1.00}
        - {feat: abs_above_ma200, dir: down, lo: 0.00, hi: 0.15, w: 0.80}
        - {feat: range_width_60, dir: down, lo: 0.08, hi: 0.25, w: 0.80}
        - {feat: vol_contract, dir: down, lo: 0.90, hi: 1.40, w: 0.60}
    B:
      gate:
        - {feat: is_breakout, dir: bool, miss: 0.05}
      core:
        - {feat: is_breakout, dir: up, lo: 0.00, hi: 1.00, w: 1.60}
        - {feat: vol_z20, dir: up, lo: 1.00, hi: 2.50, w: 1.20}
        - {feat: breakout_hold3, dir: up, lo: 0.00, hi: 3.00, w: 1.00}
        - {feat: dd_pos, dir: down, lo: 0.00, hi: 0.15, w: 0.60}
    C:
      gate:
        - {feat: above_ma200, dir: up, lo: -0.02, hi: 0.06}
        - {feat: ma200_slope, dir: up, lo: -0.01, hi: 0.04}
      core:
        - {feat: er20, dir: up, lo: 0.25, hi: 0.55, w: 1.60}
        - {feat: adx14, dir: up, lo: 20.0, hi: 35.0, w: 1.20}
        - {feat: hhll, dir: up, lo: 2.0, hi: 6.0, w: 1.00}
        - {feat: stacked, dir: up, lo: 0.00, hi: 1.00, w: 1.00}
    D:
      gate:
        - {feat: dd_pos, dir: down, lo: 0.00, hi: 0.15}
      core:
        - {feat: er20, dir: down, lo: 0.15, hi: 0.40, w: 1.20}
        - {feat: down_vol_ratio, dir: up, lo: 1.00, hi: 1.60, w: 1.00}
        - {feat: failed_breakouts_40, dir: up, lo: 1.00, hi: 3.00, w: 1.00}
        - {feat: vol_z20, dir: up, lo: 1.00, hi: 2.50, w: 0.80}
    E:
      gate_op: max
      gate:
        - {feat: above_ma200, dir: down, lo: -0.05, hi: 0.02}
        - {feat: ma200_slope, dir: down, lo: -0.06, hi: 0.01}
      core:
        - {feat: above_ma200, dir: down, lo: -0.06, hi: 0.01, w: 1.40}
        - {feat: down_er, dir: up, lo: 0.20, hi: 0.50, w: 1.20}
        - {feat: lh_ll, dir: up, lo: 2.0, hi: 6.0, w: 1.00}
        - {feat: rel_ema20, dir: down, lo: -0.03, hi: 0.03, w: 0.80}

  # 状态 -> 满仓映射系数（原代码 STATE_POS_WEIGHT 硬编码）
  weights:
    A: 0.25
    B: 0.85
    C: 0.90
    D: 0.40
    E: 0.10

# ============================================================
# L2 因果层
# ============================================================
chain:
  leader: "usNDX"        # 全球上游：纳指100 为 AI 硬件周期的定价源头
  max_lag: 30            # 领先滞后搜索上限（交易日）
  corr_look: 60          # 相关性滚动窗口
  # L2 -> L1 反馈（原实现只写报告不参与决策，此处让上游弱势真实压降下游状态权重）
  leader_suppress_thr: -0.05   # leader 20日收益低于此值开始压制
  leader_suppress_k: 0.50      # 压制强度（0=不压制）

# ============================================================
# L3 仓位层 —— 三重约束
# ============================================================
risk:
  vol_target: 0.15           # 目标组合年化波动率
  max_single: 0.35           # 单标的上限
  bucket_max: 0.30           # 同桶合计上限（相关性合并）
  corr_threshold: 0.70       # 相关性惩罚起始
  corr_penalty_k: 1.5        # 惩罚斜率
  corr_penalty_floor: 0.30   # 相关性惩罚下限（系数不得低于此值）
  kill_corr: 0.80            # 系统性风险开关阈值
  kill_deep_dd: 0.25        # SYS_CORR 判定“深度回撤”的阈值
  kill_upstream_ret20: 0.08 # UPSTREAM_WEAK 判定 leader 20 日跌幅阈值
  hedge_trigger_p_de: 0.60   # 触发对冲的 P(D)+P(E)
  hedge_max: 0.50            # 对冲上限
  portfolio_dd_assumed: 0.0  # 当前组合回撤（由用户/上游账户填入，0=无回撤）
  # ---- 风险开关对仓位的硬约束（开关必须真咬，不能只是展示）----
  switch_haircut:
    HIGH: 0.50               # HIGH 开关生效 → 总敞口乘以 0.5
    MED: 0.80                # MED 开关生效 → 总敞口乘以 0.8
  theme_cap_under_e: 0.06    # E 阶段下主题桶【组】总敞口硬上限（叙事崩塌风险无法用止损覆盖）
  # 哪些 bucket 属于主题组。组内各桶合计受 theme_cap_under_e 约束（不是每桶各 6%），
  # 否则加两个桶就把硬顶变成 12%，等于把约束静默放宽。
  theme_buckets: ["theme", "ai_hw", "pharma"]
  rebound_tactical_max: 0.08
  # 回撤节流档位表（原代码 DD_THROTTLE 硬编码）
  # 含义：组合回撤 < dd_below 时取对应 coef
  dd_throttle:
    - {dd_below: 0.05, coef: 1.00}
    - {dd_below: 0.10, coef: 0.75}
    - {dd_below: 0.15, coef: 0.50}
    - {dd_below: 0.20, coef: 0.30}
    - {dd_below: 99.0, coef: 0.15}
 # E 阶段反弹子状态下的战术仓上限（仅当 rebound.active）

# ============================================================
# L4 执行层
# ============================================================
execution:
  chase_atr_index: 1.0       # 指数级追价上限（ATR）
  chase_atr_theme: 0.7       # 主题指数追价上限（ATR）
  fail_atr_offset: 1.0       # 结构失效位（前低下方 ATR 倍数）
  fail_atr_theme: 0.5        # 主题指数失效位
  single_trade_risk_nav: 0.003   # 单笔风险≤0.3% NAV

# ============================================================
# L6 元层 —— 概率校准与归因台账
# ============================================================
meta_layer:
  calibration:
    horizon_days: 20         # 概率预测对应的前瞻窗口
    min_bucket_n: 30         # 单个概率桶最少观测数（未达则不给结论）
    brier_alert: 0.28        # Brier 劣化预警阀
  attribution:
    buckets: ["beta", "sector", "stage", "execution"]
  journal:
    require_premortem: true  # 建仓前强制写死亡条件
    require_redteam: true    # 强制写“赚的是谁的钱”

# ============================================================
# P0（2026-11-05）：账户真实净值 / 市场闸门 / 治理门禁 / ETF 映射
# 参数一律外置；本段只加约束与披露，不改 L1~L5 任何模型参数
# ============================================================
account:
  file: "account.yaml"

account_policy:
  on_missing: "no_throttle"   # 真实账户缺失 → 不压仓 + 红色披露（绝不用假设组合顶替）
  max_stale_days: 10

market_context:
  enabled: true
  stock_pool_dir: "../stock-pool"
  db_file: "data/stock_pool.db"
  gate_state_file: "data/market_gate_state.json"
  require_state: "增量"
  require_gate_open: true
  use_ideal_state: false       # O2：市场否决默认读滞回确认态 state；置 true 改读 B+ 暴露的即时态 state_ideal（转强时少否决 1-2 日，但更跳变）
  max_lag_days: 4              # 覆盖周末；快照更旧一律 fail-closed
  on_error: "veto"             # 库缺失/未定稿/异常 → 否决开新仓

etf_map:
  file: "etf_map.yaml"          # 118 只全覆盖（11 可交易 + 107 观察池）
  show_candidates: true
  max_candidates: 3

hedge:
  retail_actionable: false     # beta 对冲对个人不可直接执行
  retail_note: "融券/期指对冲对个人通常不可执行；替代方案为降低敞口、持有现金或低相关宽基"

calibration_display:
  min_settled: 30
  uncalibrated_label: "概率未校准（结算样本不足）"

decision_card:
  enabled: true                # 一页纸「今天做/不做」决策卡；735 行完整报告仍保留

# ============================================================
# P1/P2（2026-11-05）：执行换算 / 映射复核 / 结算进度 / 归因 / 提示分级
# 全部为展示与执行层参数，不改 L1~L5 任何模型阈值
# ============================================================
execution_plan:
  enabled: true
  quotes_file: "data/etf_quotes.json"
  lot_size: 100                 # 场内 ETF 买入最小 100 份
  commission_rate: 0.0003       # 佣金估算费率
  min_commission: 5.0           # 单笔最低佣金（元）
  price_max_age_hours: 72       # 覆盖周末；过期一律不换算份额
  fee_note: "佣金估算，ETF 免印花税；经手费/过户费以券商实际收费为准"

etf_review:
  suspect_score_below: 0.50     # 首选分数低于此值 → 疑似错配
  low_score_below: 0.65
  thin_liquidity_cny: 10000000  # 日成交额低于 1000 万 → 流动性提示

quality_display:
  default_level: "MED"
  high_note: "HIGH 提示直接影响 L1 状态判别与 L4 触发位可靠性：相关标的只有收盘价，ATR/ADX 为代理口径，不得据此直接下单"
  policy: "分级只影响展示；数据仍按原口径参与计算，不静默剔除样本"
  rules:
    - {match: "仅提供收盘价", level: "HIGH", category: "ohlc_proxy", label: "仅收盘价口径（ATR/ADX 代理）"}
    - {match: "日期断裂", level: "MED", category: "date_gap", label: "历史日期断裂"}
    - {match: "跳空", level: "LOW", category: "gap_kept", label: "大幅跳空（真行情，已保留）"}

attribution:
  benchmark_code: "000300"
  note: "sector/stage 未拆分（无独立基准与归因模型）；execution 为 total-beta 残差，含行业/择时/成本，不可单独解读为滑点"

# ============================================================
# 输出
# ============================================================
output:
  report_html: true
  keep_days: 180

# ============================================================
# B2 资格分引擎（2026-11-06 SSSSS 策划 B2 改良版 · P1）
# 四因子：investability 30 / state_fit 40 / data_quality 20 / map_ready 10
# 灵魂保留自 B1 原案；实现落点全部贴合现有架构（bucket_max / role / 归因台账）
# ============================================================
eligibility:
  enabled: true
  weights: {investability: 0.30, state_fit: 0.40, data_quality: 0.20, map_ready: 0.10}
  tiers: {full: 80, reduced: 60, observe: 40}   # ≥80 FULL / ≥60 REDUCED / ≥40 OBSERVE / <40 FROZEN
  hard_rules:
    state_fit_zero_frozen: true   # StateFit=0（E 态全族 / D 态事件族）→ 强制 FROZEN，分数照实算（温度计价值保留）
  enforce_sizing_zero: true       # P2：FROZEN 且 tradeable → sizing.final=0（矩阵铁律落到仓位层；置 false 可整体回滚）
  modulation:                     # P3 状态调制乘数 M：E 态占比 → 全局仓位收缩
    enabled: true
    start_ratio: 0.20             # E 态占比 ≤20% → M=1.0
    slope: 1.25                   # 每超 10pp 线性衰减
    floor: 0.50                   # 下限（11-05 E 占比 66% → M=0.5）
  lifecycle:                      # P3 生命周期（2 条连续性规则 + 冷却；晋升/降级均为建议，人工执行）
    enabled: true
    promote: {min_tier_score: 80, consecutive_days: 3}
    demote: {max_score: 60, consecutive_days: 5}
    cooldown_days: 10
    state_path: "state/eligibility_lifecycle.json"
    events_path: "state/lifecycle_events.jsonl"
  investability:
    amount_full_yi: 5.0           # 当日成交额 ≥5 亿（元/亿）→ 满分；P4 升级为 20 日均口径
    amount_floor_yi: 0.3          # <0.3 亿 → 0 分（容量地板，etf_review.thin_liquidity_cny 同源）
    premium_max_pct: 1.5          # |溢价率|>1.5% 线性扣分；快照暂无溢价源 → None 不罚（P4 接入）
  role_families:                  # role → 角色族（B2：概念复用现有 role 字段，不新建簿册）
    offense: [进攻候选, 上游映射, 固定跟踪]
    event: [事件驱动, 左侧候选]
    reference: [市场基准, 风格参照, 全球上游, 领先观察, 筛选源观察]
  reference_tradeable_as_offense: true   # 参照族但现行 tradeable=true（如恒生科技）→ 按进攻族行计 StateFit
  state_fit:                      # 5 态 × 3 角色族（初版先验；P4 用 10 年回放校准，每格需 ≥30 状态日样本）
    offense:   {A: 0.5, B: 1.0, C: 1.0, D: 0.5, E: 0.0}
    event:     {A: 0.8, B: 0.6, C: 0.3, D: 0.0, E: 0.0}
    reference: {A: 0.0, B: 0.0, C: 0.0, D: 0.0, E: 0.0}
  data_quality:
    gap_penalty: 0.3              # 存在日期断裂类警告
    warn_penalty: 0.6             # 存在其他警告（仅收盘价/跳空等）
  map_ready:
    confirmed_verified: 1.0
    confirmed_unverified: 0.8
    needs_review: 0.5
    none: 0.0
  history_path: "state/eligibility_history.jsonl"   # 逐日落盘（同 dominant history 模式），P3 连续性规则读取
  fail_closed: true               # 引擎任何异常 → 全标的 FROZEN（与 market_context on_error=veto 同哲学）
