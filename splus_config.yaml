# ============================================================
# S++ 投研管理系统 —— 配置外置（唯一口径来源）
# 原则：代码零硬编码；调整规则只改本文件
# ============================================================

meta:
  version: "1.0.0"
  project: splus
  title: "S++ 指数投研管理系统"
  note: >
    L1 状态概率 / L2 跨市场传导 / L3 三重仓位约束 / L4 执行纪律
    L5 风险开关 / L6 元归因台账。所有阈值均为可调参数，非结论。

data:
  cache_dir: "../stock-pool/_cache"
  output_dir: "data"
  state_file: "state/last_state.json"
  ledger_dir: "data/ledger"

